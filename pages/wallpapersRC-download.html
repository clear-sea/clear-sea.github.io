<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClearSea整理的风景与建筑壁纸下载页面。" />
    <title>Wallpapers | ClearSea</title>

    <link rel="stylesheet" href="../style.css" />
    <style>
        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #e6f7ff 0%, #c9efff 48%, #eaf7ff 100%);
        }

        body.dark-theme {
            background: linear-gradient(145deg, #001529 0%, #003550 48%, #001529 100%);
        }

        .wallpaper-page {
            width: min(1100px, 90%);
            height: 100vh;
            margin: 0 auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .wallpaper-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .back-link {
            color: var(--primary-color);
            font-weight: bold;
            text-decoration: none;
        }

        .back-link i {
            margin-right: 8px;
        }

        .wallpaper-title {
            margin: 0 0 8px;
            color: var(--primary-color);
            font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
            font-size: clamp(2rem, 4vw, 3.4rem);
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.05;
            text-align: center;
        }

        .wallpaper-intro {
            margin: 0 auto 24px;
            color: var(--text-secondary);
            text-align: center;
        }

        .wallpaper-shell {
            width: 100%;
            min-height: 0;
            flex: 1;
            padding: 26px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.22));
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 18px 50px var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .dark-theme .wallpaper-shell {
            background: linear-gradient(145deg, rgba(30, 50, 70, 0.82), rgba(10, 25, 42, 0.7));
            border-color: rgba(144, 202, 249, 0.16);
        }

        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            height: 100%;
            overflow-y: auto;
            padding: 2px 8px 2px 2px;
            scrollbar-color: var(--primary-color) transparent;
            scrollbar-width: thin;
        }

        .wallpaper-grid::-webkit-scrollbar {
            width: 6px;
        }

        .wallpaper-grid::-webkit-scrollbar-thumb {
            border-radius: 6px;
            background: var(--primary-color);
        }

        .wallpaper-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            box-shadow: 0 8px 20px var(--shadow);
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .wallpaper-card:hover {
            transform: translateY(-5px);
            background: var(--hover-effect);
            box-shadow: 0 14px 28px var(--shadow);
        }

        .wallpaper-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--bg-color);
        }

        .wallpaper-card-content {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            padding: 18px;
        }

        .wallpaper-card p {
            flex: 1;
            width: 100%;
            margin: 0;
            overflow-wrap: anywhere;
            color: var(--text-color);
            font-weight: 600;
        }

        .wallpaper-card a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .wallpaper-card a:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {
            .wallpaper-page {
                width: 88%;
                padding: 18px 0;
            }

            .wallpaper-header {
                margin-bottom: 22px;
            }

            .wallpaper-shell {
                padding: 16px;
            }

            .wallpaper-grid {
                grid-template-columns: 1fr;
            }

            .wallpaper-card img {
                height: 170px;
            }
        }
    </style>
</head>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeIcon.classList.toggle('fa-moon', !isDark);
            themeIcon.classList.toggle('fa-sun', isDark);
        });
    </script>
